<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankings — Empires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="layout-wrapper">
    {{SIDEBAR}}
    <div class="main-content">
        {{NAVBAR}}
        <div class="main-content-inner">

            <div class="page-header fade-in">
                <div>
                    <h1 class="page-title">🏆 Rankings</h1>
                    <p class="page-subtitle" id="rank-subtitle">Loading…</p>
                </div>
                <div class="page-header-meta">
                    <div class="btn-group">
                        <button class="btn btn-outline-light btn-sm active" data-filter="score"      onclick="rankings.switchCategory('score')">Overall</button>
                        <button class="btn btn-outline-light btn-sm"        data-filter="military"   onclick="rankings.switchCategory('military')">Military</button>
                        <button class="btn btn-outline-light btn-sm"        data-filter="economy"    onclick="rankings.switchCategory('economy')">Economy</button>
                        <button class="btn btn-outline-light btn-sm"        data-filter="technology" onclick="rankings.switchCategory('technology')">Tech</button>
                        <button class="btn btn-outline-light btn-sm"        data-filter="population" onclick="rankings.switchCategory('population')">Population</button>
                    </div>
                </div>
            </div>

            <div class="game-panel mb-4 fade-in" id="user-rank-card" style="animation-delay:.05s">
                <div class="p-3">
                    <div class="text-center text-secondary py-2 loading-pulse">Calculating your rank…</div>
                </div>
            </div>

            <div class="row g-3 mb-4" id="podium-row">
                <div class="col-md-4" id="podium-2"></div>
                <div class="col-md-4" id="podium-1"></div>
                <div class="col-md-4" id="podium-3"></div>
            </div>

            <div class="game-panel fade-in" style="animation-delay:.1s">
                <div class="game-panel-header">
                    <span>Leaderboard</span>
                    <span class="panel-badge" id="rank-count">0 nations</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th style="width:60px">Rank</th>
                                <th>Nation</th>
                                <th>Government</th>
                                <th class="text-end">Score</th>
                                <th class="text-end" id="value-col-header">Value</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <tr><td colspan="5" class="text-center py-5 loading-pulse">Loading rankings…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
{{SETTINGS_MODAL}}
<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/rankings.js"></script>
<script>
function fmtNum(n){ if(n==null) return '—'; return Number(n).toLocaleString(); }
function esc(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showToast(msg,type){
    type=type||'info';
    const c=document.getElementById('toast-container');
    const t=document.createElement('div');
    t.className=`toast toast-${type}`;
    const icons={success:'✓',error:'✕',info:'ℹ',warning:'⚠'};
    t.innerHTML=`<div class="toast-content"><span class="toast-icon">${icons[type]||'ℹ'}</span><span class="toast-message">${esc(msg)}</span></div>`;
    c.appendChild(t);
    requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },3500);
}

const _origLoad = rankings.loadData.bind(rankings);
rankings.loadData = async function(){
    try {
        const [nationsData, userData] = await Promise.all([
            api.get('/api/web/nations'),
            api.get('/api/web/user/nation')
        ]);
        this.nations       = nationsData || [];
        this.userNationId  = userData?.nation?.nation_id || null;
        this.userRank      = this.calculateUserRank();
        document.getElementById('rank-subtitle').textContent =
            `${this.nations.length} nations ranked — live data`;
        document.getElementById('rank-count').textContent = `${this.nations.length} nations`;
    } catch(e){
        console.error('Rankings load failed', e);
        this.nations = [];
    }
};
document.addEventListener('DOMContentLoaded', () => {
    const chk = setInterval(() => {
        if (auth?.initialized) { clearInterval(chk); rankings.init(); }
    }, 100);
});
</script>
</body>
</html>
