<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wars — Empires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .war-card { border:1px solid var(--border-color,#333); border-radius:10px; background:var(--bg-card,#1a1a2e); transition:.2s; }
        .war-card:hover { border-color:var(--accent-danger,#ef4444); }
        .war-card-header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border-color,#333); }
        .war-card-body { padding:12px 16px; }
        .score-bar-outer { height:8px; background:var(--bg-input,#2a2a3e); border-radius:4px; overflow:hidden; flex:1; }
        .score-bar-inner { height:100%; border-radius:4px; transition:width .6s ease; }
        .my-war-row { background:rgba(79,70,229,.08) !important; }
        .my-war-row td:first-child { border-left:3px solid var(--accent-primary,#4f46e5); }
        .filter-btn.active { background:var(--accent-primary,#4f46e5); border-color:var(--accent-primary,#4f46e5); color:#fff; }
    </style>
</head>
<body>
<div class="layout-wrapper">
    {{SIDEBAR}}
    <div class="main-content">
        {{NAVBAR}}
        <div class="main-content-inner">

            <!-- Page Header -->
            <div class="page-header fade-in">
                <div>
                    <h1 class="page-title">⚔️ Wars</h1>
                    <p class="page-subtitle" id="war-count-label">Loading…</p>
                </div>
                <div class="page-header-meta">
                    <div class="btn-group">
                        <button class="btn btn-outline-light btn-sm filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
                        <button class="btn btn-outline-light btn-sm filter-btn" data-filter="active" onclick="setFilter('active')">Active</button>
                        <button class="btn btn-outline-light btn-sm filter-btn" data-filter="ended" onclick="setFilter('ended')">Ended</button>
                    </div>
                </div>
            </div>

            <!-- My Active Wars (highlight cards) -->
            <div id="active-war-cards" class="row g-3 mb-4"></div>

            <!-- All Wars Table -->
            <div class="game-panel fade-in" style="animation-delay:.1s">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Attacker</th>
                                <th></th>
                                <th>Defender</th>
                                <th class="text-center">War Score</th>
                                <th>Started</th>
                                <th style="width:70px"></th>
                            </tr>
                        </thead>
                        <tbody id="wars-tbody">
                            <tr><td colspan="7" class="text-center py-5 loading-pulse">Loading wars…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
{{SETTINGS_MODAL}}
<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/settings.js"></script>
<script>
var allWars = [], nationMap = {}, currentFilter = 'all', myNationId = null;

function fmtNum(n) { if (n == null) return '—'; return Number(n).toLocaleString(); }
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function nationName(id) { return esc(nationMap[id] || (id ? id.slice(0, 12) : 'Unknown')); }
function showToast(msg, type) {
    if (!type) type = 'info';
    var c = document.getElementById('toast-container');
    var t = document.createElement('div');
    t.className = 'toast toast-' + type;
    var icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
    t.innerHTML = '<div class="toast-content"><span class="toast-icon">' + (icons[type] || 'ℹ') + '</span><span class="toast-message">' + esc(msg) + '</span></div>';
    c.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 300); }, 3500);
}

function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.filter === f);
    });
    render();
}

function render() {
    var filtered = currentFilter === 'all' ? allWars.slice() : allWars.filter(function (w) {
        return (w.status || '').toLowerCase() === currentFilter;
    });
    document.getElementById('war-count-label').textContent = filtered.length + ' wars';

    // Table rows
    var tbody = document.getElementById('wars-tbody');
    if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary py-5">No wars found</td></tr>';
    } else {
        tbody.innerHTML = filtered.map(function (w) {
            var isActive = w.status === 'active';
            var isMine = w.attacker_id === myNationId || w.defender_id === myNationId;
            var score = w.war_score || w.score || 0;
            var scorePct = Math.min(100, Math.max(0, score));
            var barColor = score > 50 ? 'var(--accent-danger,#ef4444)' : 'var(--accent-success,#22c55e)';
            var scoreHtml = '<div style="display:flex;align-items:center;gap:8px;justify-content:center">' +
                '<div class="score-bar-outer"><div class="score-bar-inner" style="width:' + scorePct + '%;background:' + barColor + '"></div></div>' +
                '<span class="fw-bold" style="min-width:40px;text-align:right">' + fmtNum(score) + '</span></div>';
            var statusBadge = isActive
                ? '<span class="badge bg-danger war-active-blink">ACTIVE</span>'
                : '<span class="badge bg-secondary">ENDED</span>';
            return '<tr class="' + (isMine ? 'my-war-row' : '') + '" style="cursor:pointer" onclick="window.location=\'/war/' + w.war_id + '\'">' +
                '<td>' + statusBadge + '</td>' +
                '<td class="fw-bold"><a href="/nation/' + w.attacker_id + '" onclick="event.stopPropagation()" class="' + (w.attacker_id === myNationId ? 'text-gold' : 'text-primary') + '">' + nationName(w.attacker_id) + '</a></td>' +
                '<td class="text-muted text-center">vs</td>' +
                '<td class="fw-bold"><a href="/nation/' + w.defender_id + '" onclick="event.stopPropagation()" class="' + (w.defender_id === myNationId ? 'text-gold' : 'text-primary') + '">' + nationName(w.defender_id) + '</a></td>' +
                '<td class="text-center">' + scoreHtml + '</td>' +
                '<td class="text-secondary small">' + (w.started_at ? new Date(w.started_at).toLocaleDateString() : '—') + '</td>' +
                '<td><a href="/war/' + w.war_id + '" class="btn btn-xs btn-outline-light" onclick="event.stopPropagation()">View</a></td>' +
                '</tr>';
        }).join('');
    }

    // My active war highlight cards
    var myActive = allWars.filter(function (w) {
        return w.status === 'active' && (w.attacker_id === myNationId || w.defender_id === myNationId);
    });
    var cards = document.getElementById('active-war-cards');
    if (!myActive.length) {
        cards.innerHTML = '';
    } else {
        cards.innerHTML = myActive.map(function (w) {
            var oppId = w.attacker_id === myNationId ? w.defender_id : w.attacker_id;
            var role = w.attacker_id === myNationId ? 'Attacker' : 'Defender';
            return '<div class="col-md-4">' +
                '<div class="war-card" style="border-color:var(--accent-danger,#ef4444)">' +
                '<div class="war-card-header">' +
                '<span class="war-active-blink fw-bold">⚔️ Active War</span>' +
                '<span class="badge bg-danger">' + role + '</span>' +
                '</div>' +
                '<div class="war-card-body">' +
                '<div class="fw-bold mb-2" style="font-size:1.05rem">' + nationName(oppId) + '</div>' +
                '<div class="d-flex gap-2 mt-2">' +
                '<a href="/war/' + w.war_id + '" class="btn btn-sm btn-danger flex-fill">⚔️ Attack</a>' +
                '<a href="/war/' + w.war_id + '" class="btn btn-sm btn-outline-light flex-fill">View</a>' +
                '</div></div></div></div>';
        }).join('');
    }
}

async function load() {
    try {
        var results = await Promise.all([
            api.get('/api/web/wars'),
            api.get('/api/web/nations'),
            api.get('/api/web/user/nation')
        ]);
        myNationId = results[2] && results[2].nation ? results[2].nation.nation_id : null;
        if (results[1]) {
            results[1].forEach(function (n) { nationMap[n.nation_id] = n.nation_name; });
        }
        allWars = results[0] || [];
        render();
    } catch (e) { console.error('Failed to load wars', e); }
}

document.addEventListener('DOMContentLoaded', function () {
    var chk = setInterval(function () {
        if (auth && auth.initialized) {
            clearInterval(chk);
            if (!auth.user) { window.location = '/login'; return; }
            load();
        }
    }, 100);
});
</script>
</body>
</html>
