<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nations — Empires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="layout-wrapper">
    {{SIDEBAR}}
    <div class="main-content">
        {{NAVBAR}}
        <div class="main-content-inner">

            <div class="page-header fade-in">
                <div>
                    <h1 class="page-title">🌍 Nations</h1>
                    <p class="page-subtitle" id="nation-count-label">Loading…</p>
                </div>
                <div class="page-header-meta">
                    <input type="text" id="nation-search" class="form-control" placeholder="🔍 Search nations…" style="width:220px">
                </div>
            </div>

            <!-- Sort/filter bar -->
            <div class="d-flex gap-2 mb-3 flex-wrap fade-in" style="animation-delay:.05s">
                <div class="btn-group">
                    <button class="btn btn-outline-light btn-sm active" data-sort="score"      onclick="setSort('score')">Score</button>
                    <button class="btn btn-outline-light btn-sm"        data-sort="population" onclick="setSort('population')">Population</button>
                    <button class="btn btn-outline-light btn-sm"        data-sort="land"       onclick="setSort('land')">Land</button>
                    <button class="btn btn-outline-light btn-sm"        data-sort="cash"       onclick="setSort('cash')">Cash</button>
                    <button class="btn btn-outline-light btn-sm"        data-sort="name"       onclick="setSort('name')">A–Z</button>
                </div>
                <button class="btn btn-outline-light btn-sm" id="sort-dir-btn" onclick="toggleDir()">↓ Desc</button>
            </div>

            <div class="game-panel fade-in" style="animation-delay:.1s">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead><tr>
                            <th style="width:10px">#</th>
                            <th style="width:14px"></th>
                            <th>Nation</th>
                            <th>Ruler</th>
                            <th>Government</th>
                            <th>Tier</th>
                            <th>Alliance</th>
                            <th class="text-end">Score</th>
                            <th class="text-end">Pop.</th>
                            <th style="width:70px"></th>
                        </tr></thead>
                        <tbody id="nations-tbody">
                            <tr><td colspan="10" class="text-center py-5 loading-pulse">Loading nations…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
{{SETTINGS_MODAL}}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/settings.js"></script>
<script>
let allNations=[], sortKey='score', sortAsc=false, myNationId=null;

function fmtNum(n){ if(n==null) return '—'; return Number(n).toLocaleString(); }
function esc(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function colorHex(c){ return ({BLUE:'#0d6efd',RED:'#dc3545',GREEN:'#198754',PURPLE:'#6f42c1',ORANGE:'#fd7e14',TEAL:'#20c997',PINK:'#d63384',WHITE:'#adb5bd'})[c]||'#6c757d'; }

function tierLabel(n){
    const s=n.score||n.nation_score||0;
    if(s<1000)   return '<span class="tier-badge tier-micro">Micro</span>';
    if(s<10000)  return '<span class="tier-badge tier-small">Small</span>';
    if(s<50000)  return '<span class="tier-badge tier-medium">Medium</span>';
    if(s<200000) return '<span class="tier-badge tier-large">Large</span>';
    if(s<500000) return '<span class="tier-badge tier-major">Major</span>';
    return '<span class="tier-badge tier-superpower">Superpower</span>';
}

function getSortValue(n){
    switch(sortKey){
        case 'population': return n.total_population||0;
        case 'land':       return n.total_land||0;
        case 'cash':       return n.cash||0;
        case 'name':       return (n.nation_name||'').toLowerCase();
        default:           return n.score||n.nation_score||0;
    }
}

function render(list){
    const q   = document.getElementById('nation-search').value.toLowerCase();
    let shown = q ? list.filter(n=>(n.nation_name||'').toLowerCase().includes(q)||(n.ruler_name||'').toLowerCase().includes(q)) : list;
    const sorted = [...shown].sort((a,b)=>{
        const av=getSortValue(a), bv=getSortValue(b);
        if(typeof av==='string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
        return sortAsc ? av-bv : bv-av;
    });
    document.getElementById('nation-count-label').textContent = `${shown.length} of ${allNations.length} nations`;
    const tbody = document.getElementById('nations-tbody');
    if(!sorted.length){ tbody.innerHTML='<tr><td colspan="10" class="text-center text-secondary py-5">No nations found</td></tr>'; return; }
    tbody.innerHTML = sorted.map((n,i)=>{
        const isMine = n.nation_id === myNationId;
        const atWar  = (n.wars_offensive||'[]').replace('[]','')||''+(n.wars_defensive||'[]').replace('[]','') ? (JSON.parse(n.wars_offensive||'[]').length+JSON.parse(n.wars_defensive||'[]').length)>0 : false;
        return `<tr onclick="window.location='/nation/${n.nation_id}'" class="${isMine?'table-active':''} ${atWar?'row-at-war':''} fade-in">
            <td class="text-muted small">${i+1}</td>
            <td><span class="color-sphere" style="background:${colorHex(n.national_color)}"></span></td>
            <td class="fw-bold">
                <a href="/nation/${n.nation_id}" onclick="event.stopPropagation()" class="${isMine?'text-gold':'text-primary'}">${esc(n.nation_name||'Unknown')}</a>
                ${isMine?'<span class="badge bg-warning text-dark ms-1" style="font-size:.58rem">YOU</span>':''}
            </td>
            <td class="text-secondary">${esc(n.ruler_name||'—')}</td>
            <td>${n.government_type?`<span class="gov-badge" style="font-size:.68rem">${esc(n.government_type.replace(/_/g,' '))}</span>`:'—'}</td>
            <td>${tierLabel(n)}</td>
            <td>${n.alliance_id?`<a href="/alliance/${n.alliance_id}" class="badge bg-success" onclick="event.stopPropagation()">Alliance</a>`:'<span class="text-muted">—</span>'}</td>
            <td class="text-end fw-bold text-gold">${fmtNum(n.score||n.nation_score||0)}</td>
            <td class="text-end text-secondary">${fmtNum(n.total_population)}</td>
            <td><a href="/nation/${n.nation_id}" class="btn btn-xs btn-outline-light" onclick="event.stopPropagation()">View</a></td>
        </tr>`;
    }).join('');
}

function setSort(key){
    if(sortKey===key){ sortAsc=!sortAsc; } else { sortKey=key; sortAsc=false; }
    document.querySelectorAll('[data-sort]').forEach(b=>b.classList.toggle('active',b.dataset.sort===key));
    document.getElementById('sort-dir-btn').textContent = sortAsc ? '↑ Asc' : '↓ Desc';
    render(allNations);
}
function toggleDir(){ sortAsc=!sortAsc; document.getElementById('sort-dir-btn').textContent=sortAsc?'↑ Asc':'↓ Desc'; render(allNations); }

async function load(){
    const [nations, me] = await Promise.all([api.get('/api/web/nations'), api.get('/api/web/user/nation')]);
    myNationId = me?.nation?.nation_id || null;
    allNations = nations || [];
    render(allNations);
}

document.getElementById('nation-search').addEventListener('input', ()=>render(allNations));
document.addEventListener('DOMContentLoaded',()=>{
    const chk=setInterval(()=>{ if(auth?.initialized){ clearInterval(chk); load(); } },100);
});
</script>
</body>
</html>
