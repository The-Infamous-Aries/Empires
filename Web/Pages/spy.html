<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Ops — Empires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .operation-card { background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; transition: all .15s; height: 100%; }
        .operation-card:hover { border-color: var(--accent-primary); }
        .operation-card.disabled { opacity: .5; pointer-events: none; }
        .op-icon { font-size: 1.5rem; }
        .op-name { font-size: 1rem; }
        .op-desc { line-height: 1.4; }
        .risk-badge { padding: 2px 8px; border-radius: 4px; font-size: .7rem; font-weight: 600; text-transform: uppercase; }
        .risk-low { background: rgba(34,197,94,0.2); color: #22c55e; }
        .risk-medium { background: rgba(251,191,36,0.2); color: #fbbf24; }
        .risk-high { background: rgba(249,115,22,0.2); color: #f97316; }
        .risk-very-high { background: rgba(239,68,68,0.2); color: #ef4444; }
        .risk-extreme { background: rgba(220,38,38,0.2); color: #dc2626; }
        .color-sphere-sm { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    </style>
</head>
<body>
<div class="layout-wrapper">
    {{SIDEBAR}}
    <div class="main-content">
        {{NAVBAR}}
        <div class="main-content-inner">

            <div class="page-header fade-in">
                <div>
                    <h1 class="page-title">🕵️ Spy Operations</h1>
                    <p class="page-subtitle">Intelligence, sabotage, and covert actions</p>
                </div>
                <div class="page-header-meta">
                    <div class="meta-item">
                        <span class="meta-label">Available Spies</span>
                        <span class="meta-value text-gold" id="spy-count">—</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Spy Cap</span>
                        <span class="meta-value" id="spy-cap">—</span>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="game-panel mb-4 fade-in">
                        <div class="game-panel-header"><span>👥 Spy Network</span></div>
                        <div class="p-4" id="spy-network">
                            <div class="text-center text-secondary py-4 loading-pulse">Loading…</div>
                        </div>
                    </div>
                    <div class="game-panel fade-in" style="animation-delay:.08s">
                        <div class="game-panel-header"><span>📜 Operation History</span></div>
                        <div id="op-history" class="p-3">
                            <div class="text-center text-secondary py-3 loading-pulse">Loading…</div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="game-panel fade-in" style="animation-delay:.05s">
                        <div class="game-panel-header"><span>🎯 Launch Operations</span><span class="panel-badge">Select target after choosing op</span></div>
                        <div class="p-4">
                            <div class="row g-3" id="operations-panel"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="targetModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">🎯 Select Target Nation</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="target-search" class="form-control mb-3" placeholder="Search nations…" oninput="filterTargets()">
                <div style="max-height:320px;overflow-y:auto">
                    <table class="table table-hover table-sm mb-0">
                        <thead><tr><th>Nation</th><th>Government</th><th></th></tr></thead>
                        <tbody id="target-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

{{SETTINGS_MODAL}}
<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/settings.js"></script>
<script>
let spies = 0, spyCap = 0, opHistory = [], nations = [], selectedOp = null;

function fmtNum(n){ if(n==null) return '—'; return Number(n).toLocaleString(); }
function esc(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showToast(msg,type='info'){ const c=document.getElementById('toast-container'); const t=document.createElement('div'); t.className=`toast toast-${type}`; t.innerHTML=`<div class="toast-content"><span class="toast-icon">${{success:'✓',error:'✕',info:'ℹ'}[type]||'ℹ'}</span><span class="toast-message">${esc(msg)}</span></div>`; c.appendChild(t); requestAnimationFrame(()=>t.classList.add('show')); setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },3500); }

function colorHex(c){ const m={BLUE:'#0d6efd',RED:'#dc3545',GREEN:'#198754',PURPLE:'#6f42c1',ORANGE:'#fd7e14',TEAL:'#20c997'}; return m[c]||'#6c757d'; }

const OP_TYPES = {
    intel:     { name:'Intelligence Gathering', icon:'🔍', desc:'Learn about target\'s military, economy, and resources', cost:1, risk:'Low', chance:.85 },
    sabotage:  { name:'Sabotage',               icon:'💣', desc:'Destroy target\'s infrastructure and reduce production',   cost:3, risk:'Medium', chance:.60 },
    steal_cash:{ name:'Resource Heist',          icon:'💰', desc:'Steal a portion of target\'s treasury',                 cost:2, risk:'High', chance:.45 },
    steal_tech:{ name:'Tech Theft',              icon:'📡', desc:'Steal technology research from target',                 cost:4, risk:'High', chance:.40 },
    assets:    { name:'Asset Recruitment',       icon:'🤝', desc:'Recruit agents within target nation',                   cost:5, risk:'Very High', chance:.35 },
    nuclear:   { name:'Nuclear Intel',           icon:'☢️', desc:'Investigate target\'s nuclear capabilities',            cost:10,risk:'Extreme', chance:.25 }
};

async function load(){
    try {
        const [milResp, histResp, nationsResp] = await Promise.all([
            api.get('/api/web/user/military'),
            api.get('/api/web/spy/history'),
            api.get('/api/web/nations')
        ]);
        const mil = milResp?.military || {};
        spies  = mil.spies   || 0;
        spyCap = mil.spy_cap || 0;
        opHistory = Array.isArray(histResp) ? histResp : (histResp?.operations || []);
        nations   = nationsResp || [];

        document.getElementById('spy-count').textContent = spies;
        document.getElementById('spy-cap').textContent   = spyCap;

        renderNetwork();
        renderOperations();
        renderHistory();
    } catch(e){
        console.error('Spy load failed', e);
        document.getElementById('spy-count').textContent = '0';
        document.getElementById('spy-cap').textContent   = '0';
    }
}

function renderNetwork(){
    const el = document.getElementById('spy-network');
    if (!el) return;
    const active = opHistory.filter(o => o.status === 'active' || o.status === 'pending').length;
    const completed = opHistory.filter(o => o.status === 'success' || o.status === 'failure');
    const successCount = completed.filter(o => o.status === 'success').length;
    const rate = completed.length ? Math.round(successCount / completed.length * 100) : 0;

    el.innerHTML = `
        <div class="text-center mb-4">
            <div style="font-size:3rem">🕵️</div>
            <div class="h3 fw-bold text-gold">${spies}</div>
            <div class="text-secondary">of ${spyCap} spies available</div>
        </div>
        <div class="progress mb-3" style="height:8px">
            <div class="progress-bar bg-primary" style="width:${spyCap ? (spies/spyCap*100) : 0}%"></div>
        </div>
        <hr class="border-secondary">
        <div class="d-grid gap-2 mb-3">
            <button class="btn btn-gradient-blue btn-sm" onclick="trainSpy()">Train Spy</button>
        </div>
        <div class="small">
            <div class="d-flex justify-content-between mb-2"><span class="text-secondary">Active Missions</span><span class="text-gold">${active}</span></div>
            <div class="d-flex justify-content-between mb-2"><span class="text-secondary">Success Rate</span><span>${rate}%</span></div>
            <div class="d-flex justify-content-between"><span class="text-secondary">Targets Watched</span><span>${successCount}</span></div>
        </div>`;
}

function renderOperations(){
    const el = document.getElementById('operations-panel');
    if (!el) return;
    el.innerHTML = '<div class="row g-3">' + Object.entries(OP_TYPES).map(([k, op]) => {
        const can = spies >= op.cost;
        return `<div class="col-md-6">
            <div class="operation-card ${can?'':'disabled'}">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div><span class="op-icon">${op.icon}</span> <span class="op-name fw-bold">${op.name}</span></div>
                    <span class="badge ${can?'bg-primary':'bg-secondary'}">${op.cost} spy${op.cost>1?'s':''}</span>
                </div>
                <p class="op-desc small text-secondary mb-2">${op.desc}</p>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="risk-badge risk-${op.risk.toLowerCase().replace(' ','-')}">${op.risk} Risk</span>
                    <span class="small text-muted">${Math.round(op.chance*100)}% success</span>
                </div>
                <button class="btn btn-gold w-100 mt-1" ${can?'':'disabled'} onclick="selectOp('${k}')">
                    ${can?'🚀 Launch Operation':'Not enough spies'}
                </button>
            </div>
        </div>`;
    }).join('') + '</div>';
}

function renderHistory(){
    const el = document.getElementById('op-history');
    if (!el) return;
    if (!opHistory.length) {
        el.innerHTML = '<div class="text-center py-4"><span style="font-size:2rem">📜</span><p class="text-muted mt-2 mb-0">No operations yet</p></div>';
        return;
    }
    el.innerHTML = '<div class="table-responsive"><table class="table table-dark table-sm mb-0"><thead><tr><th>Type</th><th>Target</th><th>Date</th><th>Result</th></tr></thead><tbody>' +
        opHistory.slice(0,20).map(o => {
            const op = OP_TYPES[o.operation_type] || OP_TYPES[o.type];
            const icon = op?.icon || '🎯';
            const result = o.result || o.status || '—';
            const resultBadge = result === 'success' ? 'bg-success' : result === 'failure' ? 'bg-danger' : 'bg-warning';
            return `<tr>
                <td>${icon} ${esc((o.operation_type||o.type||'').replace(/_/g,' '))}</td>
                <td>${esc(o.target_name||'Unknown')}</td>
                <td class="text-secondary">${o.created_at ? new Date(o.created_at).toLocaleDateString() : '—'}</td>
                <td><span class="badge ${resultBadge}">${esc(result)}</span></td>
            </tr>`;
        }).join('') + '</tbody></table></div>';
}

function selectOp(type){
    selectedOp = type;
    const modal = new bootstrap.Modal(document.getElementById('targetModal'));
    renderTargets('');
    modal.show();
}

function filterTargets(){
    renderTargets(document.getElementById('target-search').value);
}

function renderTargets(search){
    const tbody = document.getElementById('target-list');
    if (!tbody) return;
    const filtered = search ? nations.filter(n=>(n.nation_name||'').toLowerCase().includes(search.toLowerCase())) : nations;
    tbody.innerHTML = filtered.length ? filtered.map(n => `
        <tr>
            <td>${n.national_color ? `<span class="color-sphere-sm" style="background:${colorHex(n.national_color)}"></span>` : ''}${esc(n.nation_name)}</td>
            <td class="text-secondary small">${esc(n.government_type||'—')}</td>
            <td><button class="btn btn-sm btn-outline-primary" onclick="launchOp('${n.nation_id}','${esc(n.nation_name).replace(/'/g,"\\'")}')">Target</button></td>
        </tr>
    `).join('') : '<tr><td colspan="3" class="text-center text-secondary">No nations found</td></tr>';
}

async function launchOp(targetId, targetName){
    const op = OP_TYPES[selectedOp];
    if (!op) { showToast('No operation selected','error'); return; }
    if (spies < op.cost) { showToast('Not enough spies','error'); return; }

    try {
        const resp = await api.post('/api/web/spy/operation', { target_id: targetId, operation_type: selectedOp });
        const result = resp?.result || (resp?.success ? 'success' : 'failure');
        const msg = resp?.message || (result === 'success' ? 'Operation successful!' : 'Operation failed');

        opHistory.unshift({
            operation_id: resp?.operation_id || Date.now(),
            operation_type: selectedOp,
            target_id: targetId,
            target_name: targetName,
            result: result,
            status: result,
            created_at: new Date().toISOString()
        });
        spies -= op.cost;
        document.getElementById('spy-count').textContent = spies;
        showToast(`${op.icon} ${msg}`, result === 'success' ? 'success' : 'error');
        bootstrap.Modal.getInstance(document.getElementById('targetModal')).hide();
        document.getElementById('target-search').value = '';
        renderNetwork();
        renderOperations();
        renderHistory();
    } catch(e){
        console.error('Operation failed', e);
        showToast('Operation failed to launch','error');
    }
}

async function trainSpy(){
    try {
        const resp = await api.post('/api/web/military/buy', { unit_type: 'spies', amount: 1 });
        if (resp?.success) {
            spies++;
            document.getElementById('spy-count').textContent = spies;
            showToast('Spy trained!','success');
            renderNetwork();
            renderOperations();
        } else {
            showToast(resp?.detail || resp?.message || 'Failed to train spy','error');
        }
    } catch(e){
        console.error('Train spy failed', e);
        showToast('Failed to train spy','error');
    }
}

document.addEventListener('DOMContentLoaded',()=>{
    const chk=setInterval(()=>{ if(auth?.initialized){ clearInterval(chk); load(); } },100);
});
</script>
</body>
</html>
