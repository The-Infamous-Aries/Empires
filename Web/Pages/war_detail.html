<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Detail — Empires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .war-banner { border:1px solid var(--border-color,#333); border-radius:12px; background:var(--bg-card,#1a1a2e); overflow:hidden; }
        .attacker-col, .defender-col { flex:1; padding:20px; text-align:center; }
        .vs-col { display:flex; align-items:center; justify-content:center; padding:0 12px; font-size:1.5rem; color:var(--text-muted,#555); }
        .war-score-big { font-size:2.2rem; font-weight:800; line-height:1; }
        .war-score-bar { height:10px; background:var(--bg-input,#2a2a3e); border-radius:5px; overflow:hidden; }
        .war-score-fill { height:100%; border-radius:5px; background:linear-gradient(90deg,var(--accent-danger,#ef4444),var(--accent-warning,#f59e0b)); transition:width .8s ease; }
        .attack-result-box { padding:14px; border-radius:8px; border:1px solid var(--border-color,#333); background:var(--bg-input,#1e1e32); margin-top:12px; }
        .nation-link { font-size:1.15rem; font-weight:700; text-decoration:none; transition:.15s; }
        .nation-link:hover { text-decoration:underline; }
    </style>
</head>
<body>
<div class="layout-wrapper">
    {{SIDEBAR}}
    <div class="main-content">
        {{NAVBAR}}
        <div class="main-content-inner">

            <a href="/wars" class="btn btn-sm btn-outline-light mb-4">← Back to Wars</a>

            <!-- War Banner -->
            <div id="war-banner" class="war-banner mb-4 fade-in">
                <div class="p-5 text-center loading-pulse">Loading war…</div>
            </div>

            <!-- Attack Panel (only if active AND user is involved) -->
            <div id="attack-section" class="d-none mb-4 fade-in">
                <div class="game-panel" style="border-color:var(--accent-danger,#ef4444)">
                    <div class="game-panel-header">
                        <span>⚔️ Launch Attack</span>
                        <span class="panel-badge danger war-active-blink">Active War</span>
                    </div>
                    <div class="p-4">
                        <p class="text-secondary mb-3">Choose your attack type. Each has different costs, requirements, and effectiveness.</p>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Attack Type</label>
                                <select id="attack-type" class="form-select">
                                    <option value="GROUND">⚔️ Ground Attack — Soldiers &amp; Tanks</option>
                                    <option value="AERIAL">✈️ Aerial Attack — Aircraft</option>
                                    <option value="NAVAL">🚢 Naval Attack — Ships</option>
                                    <option value="MISSILE">🚀 Cruise Missile Strike</option>
                                    <option value="NUCLEAR">☢️ Nuclear Strike</option>
                                </select>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button class="btn btn-danger w-100" id="attack-btn" onclick="launchAttack()">⚔️ Launch Attack</button>
                            </div>
                        </div>
                        <div id="attack-result"></div>
                    </div>
                </div>
            </div>

            <!-- Peace Section (only if involved) -->
            <div id="peace-section" class="d-none mb-4 fade-in">
                <div class="game-panel">
                    <div class="game-panel-header"><span>🕊️ Propose Peace</span></div>
                    <div class="p-4">
                        <p class="text-secondary mb-3">Offer a peace treaty to end this war. Both parties must agree.</p>
                        <a href="/diplomacy" class="btn btn-outline-light">Open Diplomacy</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{{SETTINGS_MODAL}}
<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/settings.js"></script>
<script>
var warId = window.location.pathname.split('/').pop();
var warData = null, myNationId = null;

function fmtNum(n) { if (n == null) return '—'; return Number(n).toLocaleString(); }
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showToast(msg, type) {
    if (!type) type = 'info';
    var c = document.getElementById('toast-container');
    var t = document.createElement('div');
    t.className = 'toast toast-' + type;
    var icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
    t.innerHTML = '<div class="toast-content"><span class="toast-icon">' + (icons[type] || 'ℹ') + '</span><span class="toast-message">' + esc(msg) + '</span></div>';
    c.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 300); }, 3500);
}

async function load() {
    try {
        var results = await Promise.all([
            api.get('/api/web/wars/' + warId),
            api.get('/api/web/user/nation'),
            api.get('/api/web/nations')
        ]);
        var w = results[0];
        var me = results[1];
        var nations = results[2];
        var banner = document.getElementById('war-banner');
        if (!w) {
            banner.innerHTML = '<div class="p-4 text-center text-danger">War not found</div>';
            return;
        }
        warData = w;
        myNationId = me && me.nation ? me.nation.nation_id : null;

        var nmap = {};
        if (nations) nations.forEach(function (n) { nmap[n.nation_id] = n.nation_name; });

        var attName = nmap[w.attacker_id] || (w.attacker_id ? w.attacker_id.slice(0, 12) + '…' : 'Unknown');
        var defName = nmap[w.defender_id] || (w.defender_id ? w.defender_id.slice(0, 12) + '…' : 'Unknown');
        var isActive = w.status === 'active';
        var score = w.war_score || w.score || 0;
        var scorePct = Math.min(100, Math.max(0, score));
        var myRole = w.attacker_id === myNationId ? 'Attacker' : (w.defender_id === myNationId ? 'Defender' : null);

        banner.innerHTML =
            '<div class="p-4" style="border-bottom:1px solid var(--border-color,#333)">' +
            '<div class="d-flex justify-content-between align-items-center flex-wrap gap-3">' +
            '<div>' +
            '<div class="d-flex align-items-center gap-2 mb-1">' +
            '<span class="badge ' + (isActive ? 'bg-danger war-active-blink' : 'bg-secondary') + ' fs-6">' + esc(w.status ? w.status.toUpperCase() : '?') + '</span>' +
            (myRole ? '<span class="badge bg-info text-dark">You are the ' + myRole + '</span>' : '') +
            '</div>' +
            '<div class="text-muted small">War ID: <code>' + esc(w.war_id) + '</code></div>' +
            (w.reason ? '<div class="text-secondary small mt-1">Reason: <em>' + esc(w.reason) + '</em></div>' : '') +
            '</div>' +
            '<div class="text-end">' +
            '<div class="text-muted small">War Score</div>' +
            '<div class="war-score-big" style="color:' + (score > 50 ? 'var(--accent-danger,#ef4444)' : 'var(--accent-primary,#4f46e5)') + '">' + fmtNum(score) + '</div>' +
            '</div></div></div>' +

            '<div class="d-flex align-items-stretch">' +
            '<div class="attacker-col">' +
            '<div class="text-muted small text-uppercase fw-bold mb-2">Attacker</div>' +
            '<a href="/nation/' + w.attacker_id + '" class="nation-link text-danger">' + esc(attName) + '</a>' +
            '</div>' +
            '<div class="vs-col">⚔️</div>' +
            '<div class="defender-col">' +
            '<div class="text-muted small text-uppercase fw-bold mb-2">Defender</div>' +
            '<a href="/nation/' + w.defender_id + '" class="nation-link text-primary">' + esc(defName) + '</a>' +
            '</div></div>' +

            '<div class="px-4 pb-3">' +
            '<div class="d-flex justify-content-between mb-1">' +
            '<span class="text-danger small">Attacker</span>' +
            '<span class="text-primary small">Defender</span>' +
            '</div>' +
            '<div class="war-score-bar"><div class="war-score-fill" style="width:' + scorePct + '%"></div></div>' +
            '</div>' +

            '<div class="px-4 pb-3 d-flex gap-3 text-secondary small flex-wrap" style="border-top:1px solid var(--border-color,#333);padding-top:12px">' +
            '<span>Started: ' + (w.started_at ? new Date(w.started_at).toLocaleString() : '—') + '</span>' +
            (w.ended_at ? '<span>Ended: ' + new Date(w.ended_at).toLocaleString() + '</span>' : '') +
            (w.outcome ? '<span>Outcome: <strong>' + esc(w.outcome) + '</strong></span>' : '') +
            '</div>';

        // Show attack + peace panels only if active and user involved
        var attackSec = document.getElementById('attack-section');
        var peaceSec = document.getElementById('peace-section');
        if (isActive && myRole) {
            attackSec.classList.remove('d-none');
            peaceSec.classList.remove('d-none');
        } else {
            attackSec.classList.add('d-none');
            peaceSec.classList.add('d-none');
        }
    } catch (e) {
        document.getElementById('war-banner').innerHTML = '<div class="p-4 text-center text-danger">Failed to load war</div>';
        console.error('War detail load failed', e);
    }
}

async function launchAttack() {
    var btn = document.getElementById('attack-btn');
    var type = document.getElementById('attack-type').value;
    var res = document.getElementById('attack-result');
    btn.disabled = true;
    btn.textContent = 'Launching…';
    res.innerHTML = '';
    try {
        var resp = await api.post('/api/web/wars/' + warId + '/attack', { attack_type: type });
        if (resp) {
            showToast('Attack launched!', 'success');
            res.innerHTML = '<div class="attack-result-box">' +
                '<strong class="text-success">✓ Attack Result:</strong> ' +
                '<span class="text-light">' + esc(resp.message || 'Attack processed') + '</span>' +
                (resp.result ? '<pre class="text-muted small mt-2 mb-0" style="white-space:pre-wrap">' + esc(JSON.stringify(resp.result, null, 2)).slice(0, 400) + '</pre>' : '') +
                '</div>';
            // Reload war data to update score
            setTimeout(load, 1500);
        } else {
            showToast('Attack failed', 'error');
            res.innerHTML = '<div class="attack-result-box"><span class="text-danger">Attack failed — no response</span></div>';
        }
    } catch (e) {
        showToast('Attack failed: ' + (e.message || 'unknown error'), 'error');
        res.innerHTML = '<div class="attack-result-box"><span class="text-danger">✕ ' + esc(e.message || 'Request failed') + '</span></div>';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '⚔️ Launch Attack';
    }
}

document.addEventListener('DOMContentLoaded', function () {
    var chk = setInterval(function () {
        if (auth && auth.initialized) {
            clearInterval(chk);
            if (!auth.user) { window.location = '/login'; return; }
            load();
        }
    }, 100);
});
</script>
</body>
</html>
