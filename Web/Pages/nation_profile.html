<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nation Profile — Empires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="layout-wrapper">
    {{SIDEBAR}}
    <div class="main-content">
        {{NAVBAR}}
        <div class="main-content-inner">
            <div class="text-center py-5 fade-in">
                <div class="loading-pulse mb-3" style="font-size:2rem">🏰</div>
                <p class="text-secondary">Loading nation profile…</p>
            </div>
        </div>
    </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
// Redirect to the correct nation_detail page
document.addEventListener('DOMContentLoaded', () => {
    const chk = setInterval(async () => {
        if (auth?.initialized) {
            clearInterval(chk);
            const pathId = window.location.pathname.split('/').pop();
            // If the path ends with 'profile' or has no UUID-style ID, load the user's own nation
            if (!pathId || pathId === 'nation_profile' || pathId === 'profile') {
                const me = await api.get('/api/web/user/nation');
                if (me?.nation?.nation_id) {
                    window.location.replace('/nation/' + me.nation.nation_id);
                } else {
                    window.location.replace('/nations');
                }
            } else {
                window.location.replace('/nation/' + pathId);
            }
        }
    }, 100);
});
</script>
</body>
</html>
