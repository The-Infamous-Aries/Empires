<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Empires Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(251,191,36,.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(96,165,250,.04) 0%, transparent 50%);
            pointer-events: none;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            padding: 44px 36px;
            text-align: center;
            position: relative;
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--header-border);
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
        }
        .login-logo { font-size: 4.5rem; margin-bottom: 0.25rem; display: block; line-height: 1; }
        .login-title { font-size: 2.2rem; font-weight: 900; font-family: var(--font-heading); margin-bottom: 0.25rem; color: var(--accent-primary); }
        .login-subtitle { color: var(--text-muted); margin-bottom: 28px; font-size: .95rem; }
        .login-features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .login-feature {
            padding: 12px 8px;
            border-radius: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
        }
        .login-feature-icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
        .login-feature-label { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); }
        .login-footer-text { font-size: .78rem; color: var(--text-muted); margin-top: 16px; }
        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: .95rem;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            cursor: pointer;
            transition: all .2s;
            text-decoration: none;
        }
        .oauth-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }
        .oauth-btn img, .oauth-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
        .oauth-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .oauth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            color: var(--text-muted);
            font-size: .78rem;
        }
        .oauth-divider::before, .oauth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .email-form { display: none; }
        .email-form.visible { display: block; }
        .btn-google { border-color: #4285f4; color: #4285f4; }
        .btn-google:hover { background: #4285f4; color: #fff; border-color: #4285f4; }
        .btn-discord { border-color: #5865f2; color: #5865f2; }
        .btn-discord:hover { background: #5865f2; color: #fff; border-color: #5865f2; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <span class="login-logo">🏰</span>
            <h1 class="login-title">Empires</h1>
            <p class="login-subtitle" id="form-subtitle">Build · Conquer · Prosper</p>

            <div class="login-features">
                <div class="login-feature">
                    <span class="login-feature-icon">🌍</span>
                    <span class="login-feature-label">Build</span>
                </div>
                <div class="login-feature">
                    <span class="login-feature-icon">⚔️</span>
                    <span class="login-feature-label">Conquer</span>
                </div>
                <div class="login-feature">
                    <span class="login-feature-icon">🤝</span>
                    <span class="login-feature-label">Alliances</span>
                </div>
            </div>

            <div id="oauth-buttons">
                <a id="google-btn" class="oauth-btn btn-google mb-2" href="#">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    <span>Continue with Google</span>
                </a>
                <a id="discord-btn" class="oauth-btn btn-discord mb-2" href="#">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    <span>Continue with Discord</span>
                </a>
                <div class="oauth-divider">or</div>
                <button id="email-toggle-btn" class="oauth-btn" onclick="toggleEmailForm()">
                    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <span>Continue with Email</span>
                </button>
            </div>

            <div id="email-form" class="email-form">
                <div id="login-form">
                    <div class="mb-3">
                        <input type="text" id="login-username" class="form-control form-control-lg" placeholder="Username" autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <input type="password" id="login-password" class="form-control form-control-lg" placeholder="Password" autocomplete="current-password">
                    </div>
                    <button id="login-btn" class="btn btn-gold btn-lg w-100 mb-2" onclick="doLogin()">Sign In</button>
                    <p class="text-secondary mt-3 mb-0">
                        No account? <a href="#" onclick="showRegister()" class="text-accent">Register</a>
                    </p>
                    <p id="error-msg" class="text-danger mt-2 d-none small"></p>
                </div>

                <div id="register-form" class="d-none">
                    <div class="mb-3">
                        <input type="text" id="reg-username" class="form-control form-control-lg" placeholder="Choose a username" autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <input type="email" id="reg-email" class="form-control form-control-lg" placeholder="Email (optional, for recovery)" autocomplete="email">
                    </div>
                    <div class="mb-3">
                        <input type="password" id="reg-password" class="form-control form-control-lg" placeholder="Password (min 4 chars)" autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <input type="password" id="reg-confirm" class="form-control form-control-lg" placeholder="Confirm password">
                    </div>
                    <button id="register-btn" class="btn btn-gradient-blue btn-lg w-100 mb-2" onclick="doRegister()">Create Account</button>
                    <p class="text-secondary mt-3 mb-0">
                        Already have an account? <a href="#" onclick="showLogin()" class="text-accent">Sign In</a>
                    </p>
                    <p id="reg-error-msg" class="text-danger mt-2 d-none small"></p>
                </div>

                <p class="text-secondary mt-3 mb-0">
                    <a href="#" onclick="toggleEmailForm()" class="text-accent small">← Back to all sign-in options</a>
                </p>
            </div>

            <div class="login-footer-text">
                A nation simulation game &mdash; inspired by Cyber Nations, Politics &amp; War, and NationStates
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/settings.js"></script>
    <script>
        let authConfig = {};

        async function loadAuthConfig() {
            const data = await api.get('/api/auth/config');
            if (data) authConfig = data;
            const googleBtn = document.getElementById('google-btn');
            const discordBtn = document.getElementById('discord-btn');
            if (!authConfig.google_available) {
                googleBtn.classList.add('disabled');
                googleBtn.title = 'Google sign-in not configured (add EMPIRE_GOOGLE_CLIENT_ID and EMPIRE_GOOGLE_CLIENT_SECRET)';
                googleBtn.href = '#';
                googleBtn.onclick = (e) => { e.preventDefault(); alert('Google sign-in is not configured yet.'); };
            } else {
                googleBtn.href = '/api/auth/google';
            }
            if (!authConfig.discord_available) {
                discordBtn.classList.add('disabled');
                discordBtn.title = 'Discord sign-in not configured (add EMPIRE_DISCORD_CLIENT_ID and EMPIRE_DISCORD_CLIENT_SECRET)';
                discordBtn.href = '#';
                discordBtn.onclick = (e) => { e.preventDefault(); alert('Discord sign-in is not configured yet.'); };
            } else {
                discordBtn.href = '/api/auth/discord';
            }
        }

        function toggleEmailForm() {
            document.getElementById('oauth-buttons').classList.toggle('d-none');
            document.getElementById('email-form').classList.toggle('visible');
            document.getElementById('email-form').classList.toggle('d-none');
            if (document.getElementById('email-form').classList.contains('visible')) {
                document.getElementById('form-subtitle').textContent = 'Sign in with email';
            } else {
                document.getElementById('form-subtitle').textContent = 'Build · Conquer · Prosper';
            }
        }

        function showRegister() {
            document.getElementById('login-form').classList.add('d-none');
            document.getElementById('register-form').classList.remove('d-none');
            document.getElementById('form-subtitle').textContent = 'Create your empire';
        }
        function showLogin() {
            document.getElementById('register-form').classList.add('d-none');
            document.getElementById('login-form').classList.remove('d-none');
            document.getElementById('form-subtitle').textContent = 'Sign in with email';
        }

        async function doLogin() {
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('error-msg');
            btn.disabled = true;
            err.classList.add('d-none');

            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('login-username').value,
                    password: document.getElementById('login-password').value,
                })
            });

            if (resp.ok) {
                window.location.href = '/';
            } else {
                const data = await resp.json().catch(() => ({}));
                err.textContent = data.error || 'Login failed';
                err.classList.remove('d-none');
                btn.disabled = false;
            }
        }

        async function doRegister() {
            const btn = document.getElementById('register-btn');
            const err = document.getElementById('reg-error-msg');
            const pw = document.getElementById('reg-password').value;
            const cf = document.getElementById('reg-confirm').value;

            if (pw !== cf) {
                err.textContent = 'Passwords do not match';
                err.classList.remove('d-none');
                return;
            }

            btn.disabled = true;
            err.classList.add('d-none');

            const resp = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('reg-username').value,
                    password: pw,
                    email: document.getElementById('reg-email').value,
                })
            });

            if (resp.ok) {
                alert('Account created! You can now sign in.');
                showLogin();
            } else {
                const data = await resp.json().catch(() => ({}));
                err.textContent = data.error || 'Registration failed';
                err.classList.remove('d-none');
            }
            btn.disabled = false;
        }

        document.getElementById('login-password').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('reg-confirm').addEventListener('keydown', e => {
            if (e.key === 'Enter') doRegister();
        });

        loadAuthConfig();
    </script>
</body>
</html>
