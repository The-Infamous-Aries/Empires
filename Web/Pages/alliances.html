<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliances — Empires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="layout-wrapper">
    {{SIDEBAR}}
    <div class="main-content">
        {{NAVBAR}}
        <div class="main-content-inner">

            <div class="page-header fade-in">
                <div>
                    <h1 class="page-title">🤝 Alliances</h1>
                    <p class="page-subtitle" id="alliance-count-label">Loading…</p>
                </div>
                <div class="page-header-meta">
                    <button class="btn btn-gold" id="create-btn" onclick="showCreateModal()" style="display:none">+ Create Alliance</button>
                    <input type="text" id="alliance-search" class="form-control" placeholder="🔍 Search…" style="width:200px">
                </div>
            </div>

            <div class="game-panel fade-in" style="animation-delay:.08s">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead><tr>
                            <th>#</th>
                            <th>Alliance</th>
                            <th>Leader</th>
                            <th class="text-center">Members</th>
                            <th>Founded</th>
                            <th style="width:80px"></th>
                        </tr></thead>
                        <tbody id="alliances-tbody">
                            <tr><td colspan="6" class="text-center py-5 loading-pulse">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Create Alliance Modal -->
<div class="modal fade" id="createAllianceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">🤝 Create Alliance</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">Alliance Name</label>
                    <input type="text" id="new-alliance-name" class="form-control" placeholder="Enter name…" maxlength="48"></div>
                <p id="create-error" class="text-danger small d-none"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-gold" onclick="createAlliance()">Create</button>
            </div>
        </div>
    </div>
</div>

{{SETTINGS_MODAL}}
<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/settings.js"></script>
<script>
let allAlliances=[], memberCounts={};

function fmtNum(n){ if(n==null) return '—'; return Number(n).toLocaleString(); }
function esc(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showToast(msg,type='info'){ const c=document.getElementById('toast-container'); const t=document.createElement('div'); t.className=`toast toast-${type}`; t.innerHTML=`<div class="toast-content"><span class="toast-icon">${{success:'✓',error:'✕',info:'ℹ'}[type]||'ℹ'}</span><span class="toast-message">${esc(msg)}</span></div>`; c.appendChild(t); requestAnimationFrame(()=>t.classList.add('show')); setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },3500); }

function render(){
    const q = document.getElementById('alliance-search').value.toLowerCase();
    const list = q ? allAlliances.filter(a=>(a.alliance_name||'').toLowerCase().includes(q)) : allAlliances;
    const tbody = document.getElementById('alliances-tbody');
    document.getElementById('alliance-count-label').textContent = `${list.length} alliances`;
    if(!list.length){ tbody.innerHTML='<tr><td colspan="6" class="text-center text-secondary py-5">No alliances found</td></tr>'; return; }
    tbody.innerHTML = list.map((a,i)=>`
        <tr onclick="window.location='/alliance/${a.alliance_id}'" style="cursor:pointer" class="fade-in">
            <td class="text-muted small">${i+1}</td>
            <td class="fw-bold">
                <span>🏛️ </span><a href="/alliance/${a.alliance_id}" onclick="event.stopPropagation()" class="text-primary">${esc(a.alliance_name||'Unknown')}</a>
            </td>
            <td>${a.leader_nation_name ? `<a href="/nation/${a.leader_nation_id}" onclick="event.stopPropagation()" class="text-secondary">${esc(a.leader_nation_name)}</a>` : `<span class="text-muted small">${(a.leader_nation_id||'—').slice(0,8)}…</span>`}</td>
            <td class="text-center"><span class="badge bg-info">${memberCounts[a.alliance_id] ?? (a.member_count ?? '—')}</span></td>
            <td class="text-secondary small">${a.created_at ? new Date(a.created_at).toLocaleDateString() : '—'}</td>
            <td><a href="/alliance/${a.alliance_id}" class="btn btn-xs btn-outline-light" onclick="event.stopPropagation()">View</a></td>
        </tr>`).join('');
}

async function load(){
    const [data, me] = await Promise.all([api.get('/api/web/alliances'), api.get('/api/web/user/nation')]);
    allAlliances = data || [];

    if(me?.nation && !me.nation.alliance_id){
        document.getElementById('create-btn').style.display='';
    }

    try {
        const nations = await api.get('/api/web/nations');
        if(nations){
            const nMap = Object.fromEntries(nations.map(n=>[n.nation_id, n]));
            allAlliances.forEach(a=>{
                if(a.leader_nation_id && nMap[a.leader_nation_id]){
                    a.leader_nation_name = nMap[a.leader_nation_id].nation_name;
                }
            });
        }
    } catch(_){}

    render();
}

function showCreateModal(){
    const m = new bootstrap.Modal(document.getElementById('createAllianceModal'));
    m.show();
}

async function createAlliance(){
    const name = document.getElementById('new-alliance-name').value.trim();
    const errEl = document.getElementById('create-error');
    errEl.classList.add('d-none');
    if(!name || name.length < 3){ errEl.textContent='Name must be at least 3 characters'; errEl.classList.remove('d-none'); return; }
    const resp = await api.post('/api/web/alliances/create', {name});
    if(resp?.alliance){
        showToast('Alliance created!','success');
        bootstrap.Modal.getInstance(document.getElementById('createAllianceModal')).hide();
        document.getElementById('new-alliance-name').value='';
        load();
    } else {
        errEl.textContent = resp?.detail || resp?.message || 'Failed to create alliance';
        errEl.classList.remove('d-none');
    }
}

document.getElementById('alliance-search').addEventListener('input', render);
document.addEventListener('DOMContentLoaded',()=>{
    const chk=setInterval(()=>{ if(auth?.initialized){ clearInterval(chk); load(); } },100);
});
</script>
</body>
</html>
