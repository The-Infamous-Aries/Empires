<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity — Empires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="layout-wrapper">
    {{SIDEBAR}}
    <div class="main-content">
        {{NAVBAR}}
        <div class="main-content-inner">

            <div class="page-header fade-in">
                <div>
                    <h1 class="page-title">📜 Activity</h1>
                    <p class="page-subtitle">World events, wars, trades, and diplomatic activity</p>
                </div>
                <div class="page-header-meta">
                    <div class="btn-group">
                        <button class="btn btn-outline-light btn-sm active" data-filter="all"       onclick="activityFeed.switchFilter('all')">All</button>
                        <button class="btn btn-outline-light btn-sm"        data-filter="war"       onclick="activityFeed.switchFilter('war')">Wars</button>
                        <button class="btn btn-outline-light btn-sm"        data-filter="economy"   onclick="activityFeed.switchFilter('economy')">Economy</button>
                        <button class="btn btn-outline-light btn-sm"        data-filter="diplomacy" onclick="activityFeed.switchFilter('diplomacy')">Diplomacy</button>
                    </div>
                </div>
            </div>

            <div class="game-panel mb-4 fade-in" style="animation-delay:.05s">
                <div class="game-panel-header">
                    <span>🔥 Today's Highlights</span>
                    <span class="panel-badge" id="events-count">0 events</span>
                </div>
                <div class="p-3" id="highlights-panel">
                    <div class="text-center text-secondary py-3 loading-pulse">Loading events…</div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="game-panel fade-in" style="animation-delay:.1s">
                        <div class="game-panel-header">
                            <span>📜 World Events</span>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-light active" data-range="24h" onclick="activityFeed.switchRange('24h')">24h</button>
                                <button class="btn btn-outline-light"        data-range="7d"  onclick="activityFeed.switchRange('7d')">7d</button>
                                <button class="btn btn-outline-light"        data-range="30d" onclick="activityFeed.switchRange('30d')">30d</button>
                            </div>
                        </div>
                        <div class="p-3" id="activity-list">
                            <div class="text-center text-secondary py-5 loading-pulse">Loading…</div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="game-panel fade-in" style="animation-delay:.12s">
                        <div class="game-panel-header"><span>🏛️ Your Nation's Events</span></div>
                        <div id="my-activity" class="p-3">
                            <div class="text-center text-secondary py-3 loading-pulse">Loading…</div>
                        </div>
                    </div>

                    <div class="game-panel mt-3 fade-in" style="animation-delay:.16s">
                        <div class="game-panel-header"><span>⚔️ Active Wars</span></div>
                        <div id="active-wars-summary" class="p-3">
                            <div class="text-center text-secondary py-3 loading-pulse">Loading…</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{{SETTINGS_MODAL}}
<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/activity_feed.js"></script>
<script>
function fmtNum(n){ if(n==null) return '—'; return Number(n).toLocaleString(); }
function esc(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showToast(msg,type){
    type=type||'info';
    const c=document.getElementById('toast-container');
    const t=document.createElement('div');
    t.className=`toast toast-${type}`;
    const icons={success:'✓',error:'✕',info:'ℹ',warning:'⚠'};
    t.innerHTML=`<div class="toast-content"><span class="toast-icon">${icons[type]||'ℹ'}</span><span class="toast-message">${esc(msg)}</span></div>`;
    c.appendChild(t);
    requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },3500);
}

const _origLoad = activityFeed.loadData.bind(activityFeed);
activityFeed.loadData = async function(){
    try {
        const [eventsRaw, myEventsRaw, warsRaw] = await Promise.all([
            api.get('/api/web/events'),
            api.get('/api/web/user/events'),
            api.get('/api/web/wars')
        ]);

        const realEvents = Array.isArray(eventsRaw) ? eventsRaw : [];
        if (realEvents.length > 0) {
            this.events = realEvents.map(e => ({
                event_id:    e.event_id,
                event_type:  e.event_type || 'system',
                category:    e.category || (e.event_type?.includes('war') ? 'war' : 'economy'),
                icon:        this._iconFor(e.event_type),
                title:       e.event_type?.replace(/_/g,' ') || 'Event',
                description: e.event_data ? (typeof e.event_data === 'string' ? e.event_data : JSON.stringify(e.event_data)) : 'Game event',
                nation_name: e.nation_name || '—',
                nation_id:   e.nation_id,
                created_at:  e.created_at,
                importance:  'normal'
            }));
        } else {
            this.events = [];
        }

        this.myEvents = Array.isArray(myEventsRaw) ? myEventsRaw : [];

        const wars = Array.isArray(warsRaw) ? warsRaw.filter(w=>w.status==='active') : [];
        const wEl = document.getElementById('active-wars-summary');
        if(wEl){
            if(!wars.length){
                wEl.innerHTML='<p class="text-muted text-center py-2 small">No active wars</p>';
            } else {
                wEl.innerHTML = wars.slice(0,5).map(w=>`
                    <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-theme">
                        <span class="badge bg-danger war-active-blink">ACTIVE</span>
                        <span class="text-secondary small">${esc(w.attacker_name||'?')} vs ${esc(w.defender_name||'?')}</span>
                        <a href="/war/${w.war_id}" class="text-secondary small">View →</a>
                    </div>`).join('');
            }
        }
    } catch(e){
        console.error('Activity load failed', e);
        this.events = [];
        this.myEvents = [];
    }
};

activityFeed._iconFor = function(type){
    if(!type) return '📋';
    if(type.includes('war'))       return '⚔️';
    if(type.includes('peace'))     return '🕊️';
    if(type.includes('trade'))     return '💰';
    if(type.includes('alliance'))  return '🤝';
    if(type.includes('spy'))       return '🕵️';
    if(type.includes('infra'))     return '🏗️';
    if(type.includes('nuke'))      return '☢️';
    return '📋';
};

document.addEventListener('DOMContentLoaded', () => {
    const chk = setInterval(() => {
        if (auth?.initialized) { clearInterval(chk); activityFeed.init(); }
    }, 100);
});
</script>
</body>
</html>
