<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cities — Empires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .city-card { border:1px solid var(--border-color,#333); border-radius:12px; background:var(--bg-card,#1a1a2e); margin-bottom:16px; overflow:hidden; transition:.2s; }
        .city-card:hover { border-color:var(--accent-primary,#4f46e5); }
        .city-card-header { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border-color,#333); background:rgba(255,255,255,.03); }
        .city-card-name { font-size:1.1rem; font-weight:700; }
        .city-card-body { padding:14px 18px; }
        .city-stat-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-color,#222); }
        .city-stat-row:last-child { border-bottom:none; }
        .city-stat-label { font-size:.85rem; color:var(--text-muted,#888); }
        .city-stat-value { font-weight:600; font-size:.9rem; }
        .city-actions { display:flex; gap:4px; }
        .city-actions button { padding:2px 8px; font-size:.75rem; font-weight:600; border:none; border-radius:4px; cursor:pointer; color:#fff; transition:.15s; }
        .city-actions button:hover { filter:brightness(1.2); }
        .btn-buy-sm { background:var(--accent-success,#22c55e); }
        .btn-sell-sm { background:var(--accent-danger,#ef4444); }
        .quick-nav { display:flex; gap:8px; flex-wrap:wrap; }
        .quick-nav a { padding:8px 16px; border-radius:8px; border:1px solid var(--border-color,#333); text-decoration:none; color:var(--text-muted,#888); font-size:.85rem; transition:.2s; }
        .quick-nav a:hover { border-color:var(--accent-primary,#4f46e5); color:var(--text-color,#eee); }
    </style>
</head>
<body>
<div class="layout-wrapper">
    {{SIDEBAR}}
    <div class="main-content">
        {{NAVBAR}}
        <div class="main-content-inner">

            <!-- Page Header -->
            <div class="page-header fade-in">
                <div>
                    <h1 class="page-title">🏙️ Cities</h1>
                    <p class="page-subtitle" id="city-subtitle">Loading cities…</p>
                </div>
                <div class="page-header-meta">
                    <div class="meta-item">
                        <span class="meta-label">Treasury</span>
                        <span class="meta-value text-gold" id="hdr-cash">—</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Infra Cost</span>
                        <span class="meta-value" id="hdr-infra-price">—</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Land Cost</span>
                        <span class="meta-value" id="hdr-land-price">—</span>
                    </div>
                </div>
            </div>

            <!-- Resource bars -->
            <div class="game-panel mb-4 fade-in" style="animation-delay:.05s">
                <div class="game-panel-header">
                    <span>📊 Resources &amp; Production</span>
                    <a href="/market" class="btn btn-xs btn-outline-light">Market →</a>
                </div>
                <div class="p-3">
                    <div id="resource-bars-container" class="resource-bars-container">
                        <div class="text-center text-secondary py-3 loading-pulse">Loading resources…</div>
                    </div>
                </div>
            </div>

            <!-- Cities Section -->
            <div class="fade-in" style="animation-delay:.1s">
                <div class="game-panel">
                    <div class="game-panel-header">
                        <span>🏙️ Your Cities</span>
                        <span class="panel-badge" id="city-count-badge">—</span>
                    </div>
                    <div id="cities-container" class="p-3">
                        <div class="text-center text-secondary py-5 loading-pulse">Loading cities…</div>
                    </div>
                </div>
            </div>

            <!-- Quick nav -->
            <div class="mt-4 fade-in" style="animation-delay:.2s">
                <div class="quick-nav">
                    <a href="/market">🏪 Market</a>
                    <a href="/trade">🔄 Trade Circles</a>
                    <a href="/military">⚔️ Military</a>
                </div>
            </div>

        </div>
    </div>
</div>
{{SETTINGS_MODAL}}
<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/resources.js"></script>
<script>
var nationData = null;
var cities = [];

function fmtNum(n) { if (n == null || n === undefined) return '—'; return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtInt(n) { if (n == null) return '—'; return Number(n).toLocaleString(); }
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showToast(msg, type) {
    if (!type) type = 'info';
    var c = document.getElementById('toast-container');
    var t = document.createElement('div');
    t.className = 'toast toast-' + type;
    var icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
    t.innerHTML = '<div class="toast-content"><span class="toast-icon">' + (icons[type] || 'ℹ') + '</span><span class="toast-message">' + esc(msg) + '</span></div>';
    c.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 300); }, 3500);
}

function renderCities() {
    var container = document.getElementById('cities-container');
    if (!cities.length) {
        container.innerHTML = '<div class="text-center text-secondary py-5">No cities found</div>';
        return;
    }
    container.innerHTML = cities.map(function (city) {
        return '<div class="city-card fade-in">' +
            '<div class="city-card-header">' +
            '<span class="city-card-name">' + esc(city.city_name) + (city.is_capital ? ' <span class="badge bg-warning text-dark">Capital</span>' : '') + '</span>' +
            '</div>' +
            '<div class="city-card-body">' +

            '<div class="city-stat-row">' +
            '<span class="city-stat-label">🏗️ Infrastructure</span>' +
            '<div class="d-flex align-items-center gap-2">' +
            '<span class="city-stat-value">' + fmtNum(city.infrastructure) + '</span>' +
            '<div class="city-actions">' +
            '<button class="btn-sell-sm" onclick="cityAction(\'infra\',' + city.city_id + ',\'sell\',10)">-10</button>' +
            '<button class="btn-sell-sm" onclick="cityAction(\'infra\',' + city.city_id + ',\'sell\',1)">-1</button>' +
            '<button class="btn-buy-sm" onclick="cityAction(\'infra\',' + city.city_id + ',\'buy\',1)">+1</button>' +
            '<button class="btn-buy-sm" onclick="cityAction(\'infra\',' + city.city_id + ',\'buy\',10)">+10</button>' +
            '</div></div></div>' +

            '<div class="city-stat-row">' +
            '<span class="city-stat-label">🌍 Land</span>' +
            '<div class="d-flex align-items-center gap-2">' +
            '<span class="city-stat-value">' + fmtNum(city.land) + '</span>' +
            '<div class="city-actions">' +
            '<button class="btn-sell-sm" onclick="cityAction(\'land\',' + city.city_id + ',\'sell\',10)">-10</button>' +
            '<button class="btn-sell-sm" onclick="cityAction(\'land\',' + city.city_id + ',\'sell\',1)">-1</button>' +
            '<button class="btn-buy-sm" onclick="cityAction(\'land\',' + city.city_id + ',\'buy\',1)">+1</button>' +
            '<button class="btn-buy-sm" onclick="cityAction(\'land\',' + city.city_id + ',\'buy\',10)">+10</button>' +
            '</div></div></div>' +

            '<div class="city-stat-row">' +
            '<span class="city-stat-label">👥 Population</span>' +
            '<span class="city-stat-value">' + fmtInt(city.population) + '</span></div>' +

            '<div class="city-stat-row">' +
            '<span class="city-stat-label">😊 Happiness</span>' +
            '<span class="city-stat-value">' + (city.happiness != null ? Math.round(city.happiness) + '%' : '—') + '</span></div>' +

            '<div class="city-stat-row">' +
            '<span class="city-stat-label">🌿 Environment</span>' +
            '<span class="city-stat-value">' + (city.environment != null ? Math.round(city.environment) + '%' : '—') + '</span></div>' +

            '</div></div>';
    }).join('');
}

async function cityAction(type, cityId, action, amount) {
    var endpoint = type === 'infra' ? '/api/web/city/infra' : '/api/web/city/land';
    try {
        var resp = await api.post(endpoint, { city_id: cityId, action: action, amount: amount });
        if (resp && resp.success) {
            if (resp.cities) {
                cities = resp.cities;
            } else {
                var c = await api.get('/api/web/user/cities');
                if (c && c.cities) cities = c.cities;
            }
            if (resp.new_cash != null && nationData) nationData.cash = resp.new_cash;
            updateHeader();
            renderCities();
            showToast(resp.message || (action === 'buy' ? 'Purchased' : 'Sold') + ' ' + amount + ' ' + type, 'success');
        } else {
            showToast((resp && (resp.detail || resp.message)) || 'Action failed', 'error');
        }
    } catch (e) {
        showToast('Action failed: ' + e.message, 'error');
    }
}

function updateHeader() {
    if (!nationData) return;
    document.getElementById('hdr-cash').textContent = '$' + fmtNum(Math.floor(nationData.cash || 0));
    document.getElementById('city-count-badge').textContent = cities.length + ' cities';
    document.getElementById('city-subtitle').textContent = cities.length + ' ' + (cities.length === 1 ? 'city' : 'cities') + ' — develop your infrastructure and land';
}

async function init() {
    try {
        var results = await Promise.all([
            api.get('/api/web/user/nation'),
            api.get('/api/web/user/cities')
        ]);
        nationData = results[0] ? (results[0].nation || null) : null;
        cities = results[1] && results[1].cities ? results[1].cities : [];
        updateHeader();
        renderCities();
        if (typeof resourceBars !== 'undefined' && resourceBars && resourceBars.init) {
            resourceBars.init();
        }
    } catch (e) { console.error('Cities init failed', e); }
}

document.addEventListener('DOMContentLoaded', function () {
    var chk = setInterval(function () {
        if (auth && auth.initialized) {
            clearInterval(chk);
            if (!auth.user) { window.location = '/login'; return; }
            init();
        }
    }, 100);
});
</script>
</body>
</html>
