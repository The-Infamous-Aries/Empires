<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101820" />
    <title>Dominion Wars · A living world</title>
    <link rel="stylesheet" href="ui/live/game.css" />
    <script defer src="ui/live/assets.js"></script>
    <script defer src="ui/live/music.js"></script>
    <script defer src="ui/live/presentation.js"></script>
    <script defer src="ui/live/help.js"></script>
    <script defer src="ui/live/game.js"></script>
  </head>
  <body>
    <a href="#workspace" class="skip-link">Skip to game content</a>
    <div id="app">
      <main class="loading">
        <div class="crest">DW</div>
        <h1>Dominion Wars</h1>
        <p>Connecting to the world…</p>
      </main>
    </div>
    <audio id="background-music" preload="none" aria-hidden="true"></audio>
    <dialog id="action-dialog" aria-labelledby="action-title"></dialog>
    <div id="notice" role="status" aria-live="polite"></div>
    <noscript
      >This game requires JavaScript and the game server. Start the server with
      npm start.</noscript
    >
