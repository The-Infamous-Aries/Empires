<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominion Wars - Debug Init</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .log { padding: 5px; margin: 2px 0; border-radius: 3px; font-family: monospace; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        #console { max-height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background: white; }
    </style>
</head>
<body>
    <h1>Dominion Wars - Initialization Debug</h1>
    <div id="console"></div>
    
    <script>
        const consoleDiv = document.getElementById('console');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }
        
        // Override console methods to capture output
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        console.log = function(...args) {
            log(args.join(' '), 'info');
            originalLog.apply(console, args);
        };
        
        console.error = function(...args) {
            log(args.join(' '), 'error');
            originalError.apply(console, args);
        };
        
        console.warn = function(...args) {
            log(args.join(' '), 'warning');
            originalWarn.apply(console, args);
        };
        
        // Track initialization progress
        let initSteps = [];
        
        function trackInit(step) {
            initSteps.push(step);
            log(`✓ ${step}`, 'success');
        }
        
        function checkGlobal(name, description) {
            if (typeof window[name] !== 'undefined') {
                trackInit(`${description} (${name}) loaded`);
                return true;
            } else {
                log(`✗ ${description} (${name}) not found`, 'error');
                return false;
            }
        }
        
        // Start initialization testing
        log('Starting initialization test...', 'info');
        
        // Load core files one by one
        const filesToLoad = [
            { src: 'core/config.js', check: 'GameConfig', name: 'Game Config' },
            { src: 'core/event-system.js', check: 'EventBus', name: 'Event System' },
            { src: 'core/data-manager.js', check: 'DataManager_Instance', name: 'Data Manager' },
            { src: 'entities/Player.js', check: 'PlayerClass', name: 'Player Entity' },
            { src: 'entities/Nation.js', check: 'NationClass', name: 'Nation Entity' },
            { src: 'map/map-data.js', check: 'GridMapData', name: 'Grid Map Data' },
            { src: 'map/map-renderer.js', check: 'GridMapRenderer', name: 'Grid Map Renderer' },
            { src: 'ui/components/AccountCreation.js', check: null, name: 'Account Creation' },
            { src: 'ui/components/BottomMenu.js', check: 'BottomMenuSystem', name: 'Bottom Menu' },
            { src: 'core/game-engine.js', check: 'GameEngine', name: 'Game Engine' }
        ];
        
        let currentIndex = 0;
        
        function loadNext() {
            if (currentIndex >= filesToLoad.length) {
                log('All files loaded, testing initialization...', 'info');
                testInitialization();
                return;
            }
            
            const file = filesToLoad[currentIndex++];
            log(`Loading ${file.name} (${file.src})...`, 'info');
            
            const script = document.createElement('script');
            script.src = file.src;
            
            script.onload = function() {
                log(`${file.src} loaded successfully`, 'success');
                
                if (file.check) {
                    setTimeout(() => {
                        checkGlobal(file.check, file.name);
                        loadNext();
                    }, 100);
                } else {
                    trackInit(`${file.name} loaded`);
                    loadNext();
                }
            };
            
            script.onerror = function() {
                log(`Failed to load ${file.src}`, 'error');
                loadNext(); // Continue loading other files
            };
            
            document.head.appendChild(script);
        }
        
        function testInitialization() {
            log('Testing game initialization...', 'info');
            
            try {
                if (typeof GameEngine !== 'undefined') {
                    log('GameEngine found, testing initialization...', 'info');
                    
                    // Check if GameEngine can initialize
                    if (typeof GameEngine.initialize === 'function') {
                        log('GameEngine.initialize() method exists', 'success');
                    } else {
                        log('GameEngine.initialize() method missing', 'error');
                    }
                    
                    // Test account creation system
                    if (typeof AccountCreation !== 'undefined') {
                        log('AccountCreation system found', 'success');
                        
                        if (typeof AccountCreation.needsAccountCreation === 'function') {
                            const needsCreation = AccountCreation.needsAccountCreation();
                            log(`Account creation needed: ${needsCreation}`, needsCreation ? 'warning' : 'info');
                        }
                    } else {
                        log('AccountCreation system not found', 'error');
                    }
                    
                } else {
                    log('GameEngine not found', 'error');
                }
                
                log('Initialization test completed', 'info');
                
            } catch (error) {
                log(`Error during initialization test: ${error.message}`, 'error');
            }
        }
        
        // Start loading
        window.addEventListener('load', () => {
            log('Page loaded, starting file loading...', 'info');
            loadNext();
        });
        
    </script>
</body>
</html>
